name: Bug report / 问题反馈
description: Report reproducible skill behavior or packaging errors
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: scenario
    attributes:
      label: Scenario / 使用场景
      description: Describe the mode, inputs, and target generator if relevant. Do not upload images you cannot share.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际行为
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / 版本
      placeholder: v1.0.0
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Confirmation / 确认
      options:
        - label: I removed private, copyrighted, or sensitive image content that I cannot share.
          required: true

